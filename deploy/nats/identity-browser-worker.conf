# The browser worker's own stanza of the one reviewed NATS authorization file,
# `ratatoskr-platform/deploy/nats/ratatoskr.conf`, which is authoritative. This copy exists for the
# authorized-broker tests, and the workspace check fails when the two diverge once comments,
# whitespace and the nkey token are ignored. Do not merge it into a host file by hand.
#
# Only the non-secret public-nkey placeholder is replaced at deployment. The seed stays in
# `/etc/ratatoskr/extractor-browser-worker.nkey` and is named by `BROWSER_NKEY_SEED_PATH`.
#
# The worker never creates topology: Edge provisions both streams, the fixed
# `ratatoskr_browser_worker` durable and the `browser_worker_completions` bucket. The worker reads
# the bucket's stream description and entries and writes its own completion markers. There is no
# `$JS.API.>`, no `evt.>` and no `cmd.>`.
{
    nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_EXTRACTOR_BROWSER_WORKER_X
    permissions: {
        publish: {
            allow: [
                "evt.content.render.completed.v1",
                "evt.content.render.failed.v1",
                "$JS.API.CONSUMER.INFO.ratatoskr_commands.ratatoskr_browser_worker",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_commands.ratatoskr_browser_worker",
                "$JS.ACK.ratatoskr_commands.ratatoskr_browser_worker.>",
                "$JS.API.STREAM.INFO.KV_browser_worker_completions",
                "$JS.API.DIRECT.GET.KV_browser_worker_completions.>",
                "$KV.browser_worker_completions.>",
            ]
        }
        subscribe: { allow: ["_INBOX.>"] }
    }
}
