# Merge this public-nkey identity into the host NATS `authorization.users` list. The seed stays in
# `/etc/ratatoskr/extractor.nkey`; replace only this non-secret public-key placeholder.
{
    nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_EXTRACTOR
    permissions: {
        publish: {
            allow: ["evt.>", "$JS.API.>", "$JS.ACK.>"]
            deny: ["$JS.API.STREAM.DELETE.>", "$JS.API.STREAM.PURGE.>"]
        }
        subscribe: { allow: ["_INBOX.>"] }
    }
}
