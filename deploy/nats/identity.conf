# The extractor's own stanza of the one reviewed NATS authorization file,
# `ratatoskr-platform/deploy/nats/ratatoskr.conf`, which is authoritative. This copy exists for the
# authorized-broker tests, and the workspace check fails when the two diverge once comments,
# whitespace and the nkey token are ignored. Do not merge it into a host file by hand.
#
# Only the non-secret public-nkey placeholder is replaced at deployment. The seed stays in
# `/etc/ratatoskr/extractor.nkey` and is named by `RATATOSKR__BUS__NKEY_SEED_PATH`.
#
# The extractor never creates topology: Edge provisions both streams and the two fixed durables
# below. There is no `$JS.API.>`, no `evt.>` and no `cmd.>`. A denied publish is visible only in the
# NATS server log, as a `Publish Violation`.
{
    nkey: UREPLACE_ME_WITH_THE_PUBLIC_NKEY_OF_RATATOSKR_EXTRACTOR_X
    permissions: {
        publish: {
            allow: [
                "evt.content.document.extracted.v1",
                "evt.platform.operation.reported.v1",
                "cmd.content.render.requested.v1",
                "$JS.API.CONSUMER.INFO.ratatoskr_commands.ratatoskr_extractor_capture",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_commands.ratatoskr_extractor_capture",
                "$JS.ACK.ratatoskr_commands.ratatoskr_extractor_capture.>",
                "$JS.API.CONSUMER.INFO.ratatoskr_events.ratatoskr_extractor_render_awaits",
                "$JS.API.CONSUMER.MSG.NEXT.ratatoskr_events.ratatoskr_extractor_render_awaits",
            ]
        }
        subscribe: { allow: ["_INBOX.>"] }
    }
}
