[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0192: ttf-parser is unmaintained upstream and reaches this workspace only
    # through `pdf-extract` -> `lopdf` while parsing embedded TrueType fonts in untrusted PDFs.
    # No safe upgrade exists; the maintained alternative (skrifa) needs an upstream migration in
    # pdf-extract or lopdf. Revisit when either publishes a version that drops ttf-parser, or if
    # a vulnerability advisory against ttf-parser lands.
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
deny = [
    { name = "tikv-jemallocator" },
    { name = "jemallocator" },
    { name = "mimalloc" },
    { name = "snmalloc-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = ["https://github.com/po4yka/ratatoskr-contracts"]
