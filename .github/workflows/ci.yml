name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly on main, so a date-dependent test or a runner change is caught without a push.
    - cron: "25 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXTRACTOR_TEST_DATABASE_URL: postgres://extractor:extractor@127.0.0.1:5432/extractor
      EXTRACTOR_TEST_NATS_URL: nats://127.0.0.1:4222
    services:
      postgres:
        image: postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
        env:
          POSTGRES_USER: extractor
          POSTGRES_PASSWORD: extractor
          POSTGRES_DB: extractor
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U extractor -d extractor"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2-alpine \
            --jetstream --http_port 8222
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8222/healthz | grep -q ok; then exit 0; fi
            sleep 1
          done
          docker logs nats >&2
          exit 1
      - name: Take the nats-server binary from the broker image for the authorized-broker tests
        # The identity-matrix tests start their own authorization-enabled broker from the shipped
        # permission fragments, so they need the executable itself. The alpine image keeps it in
        # /usr/local/bin (only the scratch variant puts it at the filesystem root), so ask the
        # running container where it is instead of hard-coding the layout.
        run: |
          server_path="$(docker exec nats sh -c 'command -v nats-server')"
          docker cp "nats:${server_path}" "$RUNNER_TEMP/nats-server"
          echo "NATS_SERVER_BIN=$RUNNER_TEMP/nats-server" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/nats-server" --version
      - name: Install Google Chrome for browser-worker tests
        run: |
          wget -qO /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/chrome.deb || sudo apt-get install -y -f
          echo "CHROME_BIN=/usr/bin/google-chrome" >> "$GITHUB_ENV"
          google-chrome --version
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - run: cargo test -p ratatoskr-extractor-corpus --locked
      - run: cargo run --locked -p ratatoskr-extractor-corpus --bin shadow-report -- --check
      - run: tools/run-corpus-performance.sh --check
      - run: cargo test --workspace --locked --doc
      - run: cargo build --workspace --locked --release
      - run: git ls-files -z "*.rs" | xargs -0 -r wc -l | awk '$2 != "total" && $1 > 850 { print; bad = 1 } END { exit bad }'
      - name: The gate and DEVELOPMENT.md are one list
        run: |
          set -euo pipefail
          in_ci=$(awk '
            /^  [a-z][a-z0-9_-]*:[[:space:]]*$/ { in_gate = ($0 ~ /^  gate:[[:space:]]*$/) }
            in_gate && /^[[:space:]]+- run: cargo / { sub(/^[[:space:]]+- run: /, ""); print }
          ' .github/workflows/ci.yml)
          in_doc=$(awk '/^### Rust - the CI gate/{f=1} f&&/^cargo /{print} f&&/^```$/{exit}' DEVELOPMENT.md)
          test "$in_ci" = "$in_doc"

  # Separate from the gate so a new RustSec advisory cannot hide a clippy or test failure behind it.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FUZZ_TOOLCHAIN: nightly-2026-06-11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fuzz/Cargo.toml pins the same contracts revision as the root workspace
        # fuzz/ is its own Cargo workspace with its own direct git-rev pins on the contracts
        # crates, so bumping the root workspace's pin does not touch fuzz/'s. That drift compiles
        # cleanly until fuzz/ is actually built, at which point Cargo sees the same crate names at
        # two different revisions and every type constructed from them stops unifying. Catch the
        # drift here, before either side is compiled.
        run: |
          set -euo pipefail
          root_revs=$(grep -oE 'ratatoskr-contracts\.git", rev = "[0-9a-f]{40}"' Cargo.toml \
            | grep -oE '[0-9a-f]{40}' | sort -u)
          fuzz_revs=$(grep -oE 'ratatoskr-contracts\.git", rev = "[0-9a-f]{40}"' fuzz/Cargo.toml \
            | grep -oE '[0-9a-f]{40}' | sort -u)
          if [ "$(printf '%s\n' "$root_revs" | wc -l)" -ne 1 ]; then
            echo "::error file=Cargo.toml::root workspace pins more than one ratatoskr-contracts revision: $root_revs"
            exit 1
          fi
          if [ "$fuzz_revs" != "$root_revs" ]; then
            echo "::error file=fuzz/Cargo.toml::fuzz pins ratatoskr-contracts rev(s) [$fuzz_revs], root workspace pins [$root_revs]"
            exit 1
          fi
          echo "fuzz/Cargo.toml matches the root workspace pin: $root_revs"
      - name: cargo check the fuzz crate on the pinned stable toolchain
        # A plain type or dependency-graph error surfaces here in seconds, on the toolchain
        # rust-toolchain.toml already pins, instead of only after the nightly toolchain install and
        # cargo-fuzz build below have spent most of this job's 15-minute budget.
        working-directory: fuzz
        run: cargo check --locked
      - name: Install pinned fuzz toolchain
        run: rustup toolchain install nightly-2026-06-11 --profile minimal
      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1 --locked
      - name: Run bounded corpus-seeded fuzz smoke
        run: tools/run-fuzz-smoke.sh

  # The artifact the deployment runs, built for the architecture it runs on, and started once.
  #
  # The gate above certifies an x86-64 build. The target is `aarch64` with glibc 2.36
  # (`ratatoskr-workspace/docs/DEPLOYMENT_TARGET.md`), so this job builds the Dockerfile natively on
  # an arm64 runner and answers the one question the suite cannot: does the thing we ship start on
  # the thing we ship it to. It checks the configuration, serves readiness against a real database
  # and JetStream, takes SIGTERM and exits 0. A native runner, not QEMU: this repository is public,
  # so GitHub's arm64 runners cost nothing, and emulating the build takes hours.
  artifact:
    name: linux/arm64 artifact
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: |
          docker build \
            --build-arg RATATOSKR_GIT_SHA="$GITHUB_SHA" \
            --tag ratatoskr-extractor:ci .

      # The deployable set, exactly. `export` is the stage `ratatoskr-workspace`'s
      # reusable-release-artifact workflow publishes; its check refuses a binary no unit starts as
      # firmly as a missing one.
      - name: The export stage holds exactly the extractor, for aarch64
        run: |
          set -euo pipefail
          docker buildx build \
            --target export \
            --build-arg RATATOSKR_GIT_SHA="$GITHUB_SHA" \
            --output "type=local,dest=$RUNNER_TEMP/export" .
          actual=$(python3 -c 'import os, sys; print(" ".join(sorted(os.listdir(sys.argv[1]))))' "$RUNNER_TEMP/export")
          if [ "$actual" != "ratatoskr-extractor" ]; then
            echo "::error::the export stage holds '$actual', expected 'ratatoskr-extractor'"
            exit 1
          fi
          file "$RUNNER_TEMP/export/ratatoskr-extractor" | tee /dev/stderr | grep -q 'ARM aarch64'

      # Start, ready, SIGTERM, exit 0, against the real artifact. The extractor applies its own
      # schema, and `PROVISION_TOPOLOGY` lets it declare the stream and its durable, which Edge does
      # on the host. `--network host` for all three, so every address is 127.0.0.1 as in a unit.
      - name: The artifact serves and stops cleanly
        run: |
          set -euo pipefail
          docker run -d --name smoke-db --network host \
            -e POSTGRES_USER=extractor -e POSTGRES_PASSWORD=extractor -e POSTGRES_DB=extractor \
            -e POSTGRES_INITDB_ARGS="--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8" \
            postgres:17@sha256:e38411452a464af89e5adadb8d223bf53b898d47d6ef918b2d58c08707350449
          docker run -d --name smoke-bus --network host nats:2-alpine --jetstream --http_port 8222
          for _ in $(seq 1 60); do
            if docker exec smoke-db pg_isready -h 127.0.0.1 -U extractor -d extractor >/dev/null 2>&1 \
              && curl -sf http://127.0.0.1:8222/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          cat > "$RUNNER_TEMP/smoke.env" <<'ENV'
          RATATOSKR__ADMIN__BIND=127.0.0.1:9088
          RATATOSKR__BLOBS__ROOT=/blobs
          RATATOSKR__DATABASE__URL=postgres://extractor:extractor@127.0.0.1:5432/extractor
          RATATOSKR__BUS__URL=nats://127.0.0.1:4222
          RATATOSKR__BUS__DURABLE_NAME=ratatoskr_extractor_capture
          RATATOSKR__BUS__PROVISION_TOPOLOGY=true
          RATATOSKR__TELEMETRY__LOG_FORMAT=json
          ENV
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/smoke.env"
          docker run --rm --network host --env-file "$RUNNER_TEMP/smoke.env" \
            ratatoskr-extractor:ci check-config >/dev/null
          docker run -d --name smoke --network host --tmpfs /blobs:mode=1777 \
            --env-file "$RUNNER_TEMP/smoke.env" ratatoskr-extractor:ci
          ready=no
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9088/health/ready >/dev/null; then ready=yes; break; fi
            sleep 1
          done
          if [ "$ready" != yes ]; then
            docker logs smoke >&2
            echo "::error::the extractor did not report ready within 60 s"
            exit 1
          fi
          docker stop -t 40 smoke
          code=$(docker inspect -f '{{.State.ExitCode}}' smoke)
          if [ "$code" != 0 ]; then
            docker logs smoke >&2
            echo "::error::the extractor exited $code after SIGTERM"
            exit 1
          fi
          docker rm -f smoke smoke-db smoke-bus

  # The artifact of this commit, published only after the gate and the arm64 smoke test have passed
  # on it: `ghcr.io/po4yka/ratatoskr-extractor:sha-<commit>` with SHA256SUMS, an SPDX SBOM and a
  # build-provenance attestation. The steps live once, in ratatoskr-workspace (openspec
  # `release-artifacts`). A tag that already exists is never moved.
  release-artifact:
    needs: [gate, artifact]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # the OIDC token the attestation is signed with
      attestations: write  # record the attestation against this repository
    uses: po4yka/ratatoskr-workspace/.github/workflows/reusable-release-artifact.yml@b4c4b87e3f4cc527eb646c2a3786ea77cbdeb731 # main
