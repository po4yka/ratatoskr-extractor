services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: extractor
      POSTGRES_PASSWORD: extractor
      POSTGRES_DB: extractor
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und-x-icu --encoding=UTF8"
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extractor -d extractor && psql -U extractor -d extractor -c 'select 1' > /dev/null"]
      interval: 1s
      timeout: 5s
      retries: 30

  nats:
    image: nats:2-alpine
    container_name: ratatoskr-extractor-nats
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - extractor-nats-data:/data

  browser-worker:
    image: ratatoskr-browser-worker:dev
    build:
      context: .
      dockerfile: deploy/browser-worker/Dockerfile
    profiles: ["browser"]
    environment:
      BROWSER_NATS_URL: "nats://ratatoskr-extractor-nats:4222"
      BROWSER_CHROME_BIN: "/usr/bin/chromium"
      BROWSER_BLOBS_ROOT: "/data/blobs"
      BROWSER_MAX_JOBS_PER_PROCESS: 500
    volumes:
      - extractor-browser-blobs:/data/blobs
    restart: always
    cpus: 2.0
    mem_limit: 1g
    pids_limit: 256
    depends_on:
      ratatoskr-extractor-nats:
        condition: service_healthy

volumes:
  extractor-nats-data:
  extractor-browser-blobs:
